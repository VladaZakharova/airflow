#
# Emergency stop ("red button") for Google system tests on PRs. Two ways to press it:
#   * add the label "gst-stop" (stop this PR's run: Tier 1) or "gst-stop-all" (stop everything: Tier 2) to
#     the PR; only people with write access can add labels, and it works from the PR's own branch;
#   * Actions -> this workflow -> Run workflow (GitHub shows this only once the workflow is on the default
#     branch); protected by the "google-system-tests" environment.
---
name: Google system tests emergency stop
run-name: >-
  Emergency stop: ${{ inputs.action || github.event.label.name }}
  ${{ inputs.run-id || github.event.pull_request.number }}
on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: "stop-run = one run (Tier 1); stop-all = everything + revoke access (Tier 2); restore"
        required: true
        type: choice
        options: [stop-run, stop-all, restore]
      run-id:
        description: "GitHub run id to stop (for stop-run; the number in the run's URL)"
        required: false
        default: ""
      pr:
        description: "PR number of that run (optional, for stop-run)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  emergency-label:
    name: "Emergency ${{ github.event.label.name }} (PR label)"
    if: >-
      github.repository != 'apache/airflow' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'gst-stop' || github.event.label.name == 'gst-stop-all')
    runs-on: [self-hosted, google-system-tests]
    permissions:
      contents: read
      actions: write
      pull-requests: write
    env:
      SYSTEM_TESTS_GCP_PROJECT: ${{ vars.SYSTEM_TESTS_GCP_PROJECT }}
      RUNNER_SERVICE_ACCOUNT: ${{ vars.RUNNER_SERVICE_ACCOUNT }}
      RUNNER_ZONE: ${{ vars.RUNNER_ZONE }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      LABEL: ${{ github.event.label.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Run the emergency action"
        run: |
          echo "## Emergency ${LABEL} on PR #${PR_NUMBER} by ${GITHUB_ACTOR}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${LABEL}" == "gst-stop-all" ]]; then
            scripts/ci/testing/gst_emergency.sh stop-all
          else
            scripts/ci/testing/gst_emergency.sh stop-pr "${PR_NUMBER}"
          fi
      - name: "Remove the label so it can be used again"
        if: always()
        run: >-
          curl -sS -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}"
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${LABEL}"
          > /dev/null

  emergency:
    name: "Emergency ${{ inputs.action }}"
    if: github.repository != 'apache/airflow' && github.event_name == 'workflow_dispatch'
    environment: google-system-tests
    runs-on: [self-hosted, google-system-tests]
    permissions:
      contents: read
      actions: write
      pull-requests: write
    env:
      SYSTEM_TESTS_GCP_PROJECT: ${{ vars.SYSTEM_TESTS_GCP_PROJECT }}
      RUNNER_SERVICE_ACCOUNT: ${{ vars.RUNNER_SERVICE_ACCOUNT }}
      RUNNER_ZONE: ${{ vars.RUNNER_ZONE }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      ACTION: ${{ inputs.action }}
      RUN_ID: ${{ inputs.run-id }}
      PR_NUMBER: ${{ inputs.pr }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Run the emergency action"
        run: |
          echo "## Emergency ${ACTION} by ${GITHUB_ACTOR}" >> "${GITHUB_STEP_SUMMARY}"
          scripts/ci/testing/gst_emergency.sh "${ACTION}" ${RUN_ID:+"${RUN_ID}"} ${PR_NUMBER:+"${PR_NUMBER}"}
